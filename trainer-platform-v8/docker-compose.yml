services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://ts-gateway
      VITE_API_PROXY_REWRITE_TO_V1: "true"
      VITE_DEV_PORT: "5173"
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-126721172338-cdgjih6mknr138lnoh1h79iouiuks6ae.apps.googleusercontent.com}
      VITE_LINKEDIN_CLIENT_ID: ${VITE_LINKEDIN_CLIENT_ID:-}
      VITE_LINKEDIN_REDIRECT_URI: ${VITE_LINKEDIN_REDIRECT_URI:-https://localhost:5174/auth/linkedin/callback}
      VITE_LINKEDIN_SCOPES: ${VITE_LINKEDIN_SCOPES:-r_liteprofile r_emailaddress}
    ports:
      - "5173:5173"
    networks:
      - default
      - trainersync_microservices
 
  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles:
      - quality
 
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - quality
    depends_on:
      - sonarqube
    working_dir: /usr/src
    volumes:
      - ./:/usr/src
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    command: sonar-scanner -Dsonar.host.url=http://sonarqube:9000
 
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  trainersync_microservices:
    external: true
    name: microservices_trainersync
 
 

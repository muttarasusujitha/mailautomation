services:
  frontend:
    image: ghcr.io/muttarasusujitha/trainersync/frontend:latest
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_API_PROXY_TARGET: http://ts-gateway:80
      VITE_EMAIL_SERVICE_PROXY_TARGET: http://ts-email-service:8002
      VITE_TRAINER_SERVICE_PROXY_TARGET: http://ts-trainer-service:8004
      VITE_INTELLIGENCE_SERVICE_PROXY_TARGET: http://ts-intelligence-service:8005
      VITE_CORE_API_PROXY_TARGET: http://ts-gateway:80
      VITE_API_PROXY_REWRITE_TO_V1: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/src/pages/Admin.jsx:/app/src/pages/Admin.jsx:ro
      - ./frontend/src/pages/Inbox.jsx:/app/src/pages/Inbox.jsx:ro
      - ./frontend/src/pages/GmailCallback.jsx:/app/src/pages/GmailCallback.jsx:ro
      - ./frontend/src/pages/LinkedInSearch.jsx:/app/src/pages/LinkedInSearch.jsx:ro
      - ./frontend/src/pages/ClientRequests.jsx:/app/src/pages/ClientRequests.jsx:ro
      - ./frontend/src/components/LeadBot.jsx:/app/src/components/LeadBot.jsx:ro
      - ./frontend/src/utils/leadSearchFeedback.js:/app/src/utils/leadSearchFeedback.js:ro
    networks:
      - trainersync

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles:
      - quality

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - quality
    depends_on:
      - sonarqube
    working_dir: /usr/src
    volumes:
      - ./:/usr/src
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    command: sonar-scanner -Dsonar.host.url=http://sonarqube:9000

volumes:
  mongo_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  trainersync:
    external: true

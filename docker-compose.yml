services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_PROXY_REWRITE_TO_V1: "true"
    ports:
      - "5174:5174"
    networks:
      - microservices_trainersync

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles:
      - quality

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - quality
    depends_on:
      - sonarqube
    working_dir: /usr/src
    volumes:
      - ./:/usr/src
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    command: sonar-scanner -Dsonar.host.url=http://sonarqube:9000

volumes:
  mongo_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  microservices_trainersync:
    external: true
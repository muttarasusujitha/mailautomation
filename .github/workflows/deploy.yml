
name: TrainerSync CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: trainersync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/trainersync

jobs:
  # ============================================================
  # STAGE 1 - CHECKOUT
  # ============================================================
  source-code:
    name: Stage 1 - Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository
        run: |
          set -euo pipefail
          pwd
          ls -la
          echo "Repository checkout successful"

  # ============================================================
  # STAGE 2A - BACKEND TESTS
  # ============================================================
  build-test:
    name: Stage 2 - Backend Build & Test
    needs: source-code
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - core-api
          - email-service
          - notification-service
          - trainer-service
          - intelligence-service
          - document-service
          - scheduler-service
          - meet-bot-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: microservices/services/${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Validate Python
        working-directory: microservices/services/${{ matrix.service }}
        run: python -m compileall .

      - name: Run Service Tests
        working-directory: microservices/services/${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m pip install pytest pytest-asyncio

          if [ -d tests ]; then
            PYTHONPATH=.:../.. python -m pytest -v
          else
            echo "No service-specific tests directory found"
          fi

      - name: Check Shared Commercial and Identity Rules
        if: matrix.service == 'trainer-service'
        working-directory: microservices
        run: |
          set -euo pipefail
          python -m pytest \
            shared/test_commercial_policy.py \
            shared/test_requirement_duration.py \
            shared/test_trainer_identity.py \
            -q

  # ============================================================
  # STAGE 2B - FRONTEND TESTS AND BUILD
  # ============================================================
  frontend-build:
    name: Stage 2 - Frontend Build
    needs: source-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Files
        run: |
          set -euo pipefail
          test -f frontend/package.json
          test -f frontend/package-lock.json
          ls -la frontend

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  # ============================================================
  # STAGE 3 - DOCKER BUILD AND PUSH
  # ============================================================
  docker-build-push:
    name: Stage 3 - Docker Build & Push

    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    needs:
      - build-test
      - frontend-build

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        include:
          - image: auth-service
            dockerfile: microservices/services/auth-service/Dockerfile
            context: .

          - image: core-api
            dockerfile: microservices/services/core-api/Dockerfile
            context: .

          - image: email-service
            dockerfile: microservices/services/email-service/Dockerfile
            context: .

          - image: notification-service
            dockerfile: microservices/services/notification-service/Dockerfile
            context: .

          - image: trainer-service
            dockerfile: microservices/services/trainer-service/Dockerfile
            context: .

          - image: intelligence-service
            dockerfile: microservices/services/intelligence-service/Dockerfile
            context: .

          - image: document-service
            dockerfile: microservices/services/document-service/Dockerfile
            context: .

          - image: scheduler-service
            dockerfile: microservices/services/scheduler-service/Dockerfile
            context: .

          - image: meet-bot-service
            dockerfile: microservices/services/meet-bot-service/Dockerfile
            context: .

          - image: gateway-service
            dockerfile: microservices/gateway/Dockerfile
            context: .

          - image: celery-service
            dockerfile: microservices/services/scheduler-service/Dockerfile
            context: .

          - image: celery-beat-service
            dockerfile: microservices/services/scheduler-service/Dockerfile
            context: .

          - image: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          set -euo pipefail
          docker --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ============================================================
  # STAGE 4 - DEPLOY TO SELF-HOSTED UBUNTU
  # ============================================================
  deploy-ec2:
    name: Stage 4 - Deploy to EC2

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - docker-build-push

    runs-on: self-hosted

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/trainersync

    defaults:
      run:
        shell: bash
        working-directory: deploy-source

    steps:
      - name: Prepare deployment workspace
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          token="deploy-source/microservices/gmail_config/token.json"
          if [ -f "$token" ] && [ ! -w "$token" ]; then
            sudo -n chown "$(id -u):$(id -g)" "$token"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: deploy-source

      - name: Verify Docker and Compose
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker info >/dev/null
          echo "Docker is ready"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Create backend environment without requiring Python
      # ----------------------------------------------------------
      - name: Create Backend Environment
        working-directory: ${{ github.workspace }}/deploy-source/microservices
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_FALLBACK_USER: ${{ secrets.GMAIL_FALLBACK_USER }}
          STYLE_IMAP_USER: ${{ secrets.STYLE_IMAP_USER }}
          STYLE_IMAP_PASSWORD: ${{ secrets.STYLE_IMAP_PASSWORD }}
          GMAIL_FALLBACK_FROM_EMAIL: ${{ secrets.GMAIL_FALLBACK_FROM_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_TIMEZONE: ${{ secrets.GOOGLE_CALENDAR_TIMEZONE }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -euo pipefail

          test -f .env.example
          cp .env.example .env

          set_env() {
            local key="$1"
            local value="$2"
            export ENV_KEY="$key"
            export ENV_VALUE="$value"

            awk '
              BEGIN {
                key = ENVIRON["ENV_KEY"]
                value = ENVIRON["ENV_VALUE"]
                prefix = key "="
              }

              index($0, prefix) == 1 {
                if (!found) {
                  print prefix value
                  found = 1
                }
                next
              }

              { print }

              END {
                if (!found) {
                  print prefix value
                }
              }
            ' .env > .env.tmp

            mv .env.tmp .env
          }

          set_env GMAIL_USER "$GMAIL_USER"
          set_env GMAIL_FALLBACK_USER "$GMAIL_FALLBACK_USER"
          set_env STYLE_IMAP_USER "$STYLE_IMAP_USER"
          set_env STYLE_IMAP_PASSWORD "$STYLE_IMAP_PASSWORD"
          set_env GMAIL_FALLBACK_FROM_EMAIL "$GMAIL_FALLBACK_FROM_EMAIL"
          set_env FROM_EMAIL "$FROM_EMAIL"
          set_env FROM_NAME "$FROM_NAME"
          set_env GOOGLE_TOKEN_FILE "config/token.json"
          set_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          set_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          set_env GOOGLE_REDIRECT_URI "$GOOGLE_REDIRECT_URI"
          set_env GOOGLE_CALENDAR_ID "$GOOGLE_CALENDAR_ID"
          set_env GOOGLE_CALENDAR_TIMEZONE "$GOOGLE_CALENDAR_TIMEZONE"
          set_env FRONTEND_URL "$FRONTEND_URL"

          chmod 600 .env
          echo "Backend environment file created successfully"

      # ----------------------------------------------------------
      # Create frontend environment
      # ----------------------------------------------------------
      - name: Create Frontend Environment
        working-directory: ${{ github.workspace }}/deploy-source
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf 'VITE_GOOGLE_CLIENT_ID=%s\n' \
            "$VITE_GOOGLE_CLIENT_ID" > .env
          chmod 600 .env
          echo "Frontend environment file created successfully"

      # ----------------------------------------------------------
      # Validate both Compose configurations
      # ----------------------------------------------------------
      - name: Validate Compose Configurations
        run: |
          set -euo pipefail

          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER}/trainersync"

          docker compose \
            -f microservices/docker-compose.yml \
            -f microservices/docker-compose.registry.yml \
            config --quiet

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.registry.yml \
            config --quiet

          echo "Both Compose configurations are valid"

      - name: Check Deployment Disk Space
        run: bash .github/scripts/check-docker-space.sh

      # ----------------------------------------------------------
      # Pull registry images before replacing running services
      # ----------------------------------------------------------
      - name: Pull Latest Images
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
        run: |
          set -euo pipefail

          docker compose \
            -f microservices/docker-compose.yml \
            -f microservices/docker-compose.registry.yml \
            pull

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.registry.yml \
            pull frontend

      # ----------------------------------------------------------
      # Build the meeting bot locally
      # ----------------------------------------------------------
      - name: Build Meet Bot
        run: |
          set -euo pipefail
          docker compose \
            -f microservices/docker-compose.yml \
            build meet-bot-service

      # ----------------------------------------------------------
      # Start backend services
      # ----------------------------------------------------------
      - name: Start Backend Services
        run: |
          set -euo pipefail

          docker compose \
            -f microservices/docker-compose.yml \
            -f microservices/docker-compose.registry.yml \
            up -d \
            --no-build \
            --pull never \
            --wait \
            --wait-timeout 180

      # ----------------------------------------------------------
      # Start frontend
      # ----------------------------------------------------------
      - name: Start Frontend
        run: |
          set -euo pipefail

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.registry.yml \
            up -d \
            --no-build \
            --pull never \
            --wait \
            --wait-timeout 120 \
            frontend

      # ----------------------------------------------------------
      # Verify deployment
      # ----------------------------------------------------------
      - name: Verify Deployment
        run: |
          set -euo pipefail

          echo "===== RUNNING CONTAINERS ====="
          docker ps

          echo "===== BACKEND SERVICES ====="
          docker compose \
            -f microservices/docker-compose.yml \
            -f microservices/docker-compose.registry.yml \
            ps

          echo "===== FRONTEND SERVICES ====="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.registry.yml \
            ps

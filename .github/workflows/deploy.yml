name: TrainerSync CI/CD Pipeline
 
on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main
 
permissions:

  contents: write

  packages: write
 
 
env:

  REGISTRY: ghcr.io

  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/trainersync
 
 
# ==========================================================

# STAGE 1 : SOURCE CODE

# ==========================================================
 
jobs:
 
  source-code:

    name: "Stage 1 - Source Code Checkout"

    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Repository

        uses: actions/checkout@v4
 
      - name: Display Repository Information

        run: |

          echo "Repository Checked Out"

          echo "Branch: ${{ github.ref }}"

          ls -la
 
 
# ==========================================================

# STAGE 2 : BUILD & TEST

# ==========================================================
 
  build-test:

    name: "Stage 2 - Build & Test"

    needs: source-code

    runs-on: ubuntu-latest
 
 
    strategy:

      fail-fast: false
 
      matrix:

        service:
 
          - auth-service

          - core-api

          - email-service

          - notification-service

          - trainer-service

          - intelligence-service

          - document-service

          - scheduler-service
 
 
    steps:
 
      - name: Checkout Repository

        uses: actions/checkout@v4
 
 
      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"
 
 
      - name: Install Dependencies

        working-directory: microservices/services/${{ matrix.service }}

        run: |
 
          python -m pip install --upgrade pip
 
          if [ -f requirements.txt ]; then

              pip install -r requirements.txt

          fi
 
 
      - name: Python Syntax Validation

        working-directory: microservices/services/${{ matrix.service }}

        run: |
 
          python -m compileall .
 
 
      - name: Run Tests

        working-directory: microservices/services/${{ matrix.service }}

        run: |
 
          if [ -d tests ]; then
 
            pip install pytest

            pytest -v
 
          else
 
            echo "No tests found"
 
          fi
 
        # ==========================================================
# STAGE 2 : FRONTEND BUILD
# ==========================================================
 
  frontend-build:
 
    name: "Stage 2 - Frontend Build"
 
    needs: source-code
 
    runs-on: ubuntu-latest
 
 
    steps:
 
 
      - name: Checkout Repository
 
        uses: actions/checkout@v4
 
 
      - name: Setup Node.js
 
        uses: actions/setup-node@v4
 
        with:
 
          node-version: "20"
 
 
      - name: Install Frontend Dependencies
 
        working-directory: frontend
 
        run: |
 
          npm ci --legacy-peer-deps
 
 
      - name: Build Frontend Application
 
        working-directory: frontend
 
        run: |
 
          npm run build

          
# STAGE 3 : DOCKER BUILD + GHCR PUSH

# ==========================================================
 
 
  docker-build-push:
 
    name: "Stage 3 - Build Docker Images & Push GHCR"
 
    needs:
 
      - build-test

      - frontend-build
 
    runs-on: ubuntu-latest
 
 
    strategy:
 
      fail-fast: false
 
      matrix:
 
        include:
 
 
          - image: auth-service

            dockerfile: microservices/services/auth-service/Dockerfile
 
 
          - image: core-api

            dockerfile: microservices/services/core-api/Dockerfile
 
 
          - image: email-service

            dockerfile: microservices/services/email-service/Dockerfile
 
 
          - image: notification-service

            dockerfile: microservices/services/notification-service/Dockerfile
 
 
          - image: trainer-service

            dockerfile: microservices/services/trainer-service/Dockerfile
 
 
          - image: intelligence-service

            dockerfile: microservices/services/intelligence-service/Dockerfile
 
 
          - image: document-service

            dockerfile: microservices/services/document-service/Dockerfile
 
 
          - image: scheduler-service

            dockerfile: microservices/services/scheduler-service/Dockerfile
 
 
          - image: gateway

            dockerfile: microservices/gateway/Dockerfile
 
 
    steps:
 
 
      - name: Checkout Repository
 
        uses: actions/checkout@v4
 
 
      - name: Login GHCR
 
        uses: docker/login-action@v3
 
        with:
 
          registry: ghcr.io
 
          username: ${{ github.actor }}
 
          password: ${{ secrets.GITHUB_TOKEN }}
 
 
      - name: Docker Metadata
 
        id: meta
 
        uses: docker/metadata-action@v5
 
        with:
 
          images: |
 
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
 
          tags: |
 
            latest
 
            sha-${{ github.sha }}
 
 
 
      - name: Build and Push Docker Image
 
        uses: docker/build-push-action@v6
 
        with:
 
          context: .
 
          file: ${{ matrix.dockerfile }}
 
          push: true
 
          tags: ${{ steps.meta.outputs.tags }}
 
 
 
 
# ==========================================================

# STAGE 4 : DEPLOY TO EC2

# ==========================================================
 
  deploy-ec2:
 
    name: "Stage 4 - Deploy to EC2"
 
    needs:

      - docker-build-push
 
    if: github.ref == 'refs/heads/main'
 
    runs-on: ubuntu-latest
 
 
    steps:
 
 
      - name: Checkout Repository
 
        uses: actions/checkout@v4
 
 
      # AWS LOGIN

      - name: Configure AWS Credentials
 
        uses: aws-actions/configure-aws-credentials@v4
 
        with:
 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
 
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
          aws-region: ${{ secrets.AWS_REGION }}
 
 
      # Verify AWS Login
 
      - name: Verify AWS Identity
 
        run: |
 
          aws sts get-caller-identity
 
 
      # Configure SSH
 
      - name: Configure SSH
 
        run: |
 
          mkdir -p ~/.ssh
 
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
 
          chmod 600 ~/.ssh/id_rsa
 
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
 
 
 
      # Deploy
 
      - name: Deploy Application
 
        env:
 
          EC2_USER: ${{ secrets.EC2_USER }}
 
          EC2_HOST: ${{ secrets.EC2_HOST }}
 
          GITHUB_USERNAME: ${{ github.repository_owner }}
 
          REPOSITORY: ${{ github.event.repository.name }}
 
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
 
        run: |
 
 
          ssh ${EC2_USER}@${EC2_HOST} << EOF
 
 
          set -e
 
 
          APP_DIR=/home/ubuntu/mailautomation
 
 
          echo "Checking Repository"
 
 
          if [ ! -d "\$APP_DIR/.git" ]; then
 
 
              echo "Cloning Repository"
 
 
              git clone https://github.com/${GITHUB_USERNAME}/${REPOSITORY}.git \$APP_DIR
 
 
          else
 
 
              echo "Updating Repository"
 
 
              cd \$APP_DIR
 
              git fetch origin
 
              git reset --hard origin/main
 
 
          fi
 
 
          cd \$APP_DIR/microservices
 
 
          echo "Login to GHCR"
 
 
          echo "${GHCR_TOKEN}" | docker login ghcr.io \

          -u ${GITHUB_USERNAME} \

          --password-stdin
 
 
          echo "Pull Latest Docker Images"
 
 
          docker compose pull
 
 
          echo "Stopping Existing Containers"
 
 
          docker compose down --remove-orphans
 
 
          echo "Starting New Containers"
 
 
          docker compose up -d
 
 
          echo "Removing Old Images"
 
 
          docker image prune -af
 
 
          echo "Deployment Completed"
 
 
          docker compose ps
 
 
          EOF
 
 
 
      - name: Verify Containers
 
        run: |
 
 
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
 
          "docker ps"
 
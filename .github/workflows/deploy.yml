name: TrainerSync Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python - <<'PY'
import os
from pathlib import Path
key = os.environ['EC2_SSH_KEY']
key = key.replace('\r', '')
if '\\n' in key:
    key = key.replace('\\n', '\n')
path = Path.home() / '.ssh' / 'id_rsa'
path.write_text(key)
print('SSH key length:', len(key))
PY
          chmod 600 ~/.ssh/id_rsa
          ls -l ~/.ssh/id_rsa
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts || true

      - name: Deploy to EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -euo pipefail
          cd "${{ secrets.PROJECT_PATH }}"
          echo "Updating Repository..."
          git fetch origin
          git reset --hard origin/main
          echo "Checking Docker Compose..."
          docker compose config
          echo "Stopping old containers..."
          docker compose down --remove-orphans
          echo "Removing old images..."
          docker image prune -f
          echo "Building latest images..."
          docker compose build --parallel
          echo "Starting containers..."
          docker compose up -d
          echo "Waiting for containers..."
          sleep 20
          echo "Running Containers"
          docker compose ps
          echo "Docker Status"
          docker ps
          echo "Deployment Successful"
          EOF

name: TrainerSync Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          : "${EC2_SSH_KEY:?EC2_SSH_KEY secret is required}"
          : "${EC2_HOST:?EC2_HOST secret is required}"
          mkdir -p ~/.ssh
          python -c 'import os; from pathlib import Path; key=os.environ["EC2_SSH_KEY"]; key=key.replace("\r", ""); key=key.replace("\\n", "\n"); path=Path.home() / ".ssh" / "id_rsa"; path.write_text(key); print("SSH key length:", len(key))'
          chmod 600 ~/.ssh/id_rsa
          ls -l ~/.ssh/id_rsa
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts || true

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        run: |
          set -euo pipefail
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${PROJECT_PATH:?PROJECT_PATH secret is required}"

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "PROJECT_PATH=${PROJECT_PATH@Q} bash -s" << 'EOF'
          set -euo pipefail
          cd "${PROJECT_PATH}"
          test -d .git || { echo "PROJECT_PATH must point to the mailautomation git checkout"; exit 1; }
          test -f microservices/docker-compose.yml || { echo "microservices/docker-compose.yml not found"; exit 1; }
          test -f microservices/.env || { echo "microservices/.env is required on the EC2 host"; exit 1; }

          echo "Updating Repository..."
          git fetch origin
          git reset --hard origin/main
          echo "Checking Docker Compose..."
          docker compose -f microservices/docker-compose.yml config
          echo "Stopping old containers..."
          docker compose -f microservices/docker-compose.yml down --remove-orphans
          echo "Removing old images..."
          docker image prune -f
          echo "Building latest images..."
          docker compose -f microservices/docker-compose.yml build --parallel
          echo "Starting containers..."
          docker compose -f microservices/docker-compose.yml up -d
          echo "Waiting for containers..."
          sleep 20
          echo "Running Containers"
          docker compose -f microservices/docker-compose.yml ps
          echo "Docker Status"
          docker ps
          echo "Deployment Successful"
          EOF

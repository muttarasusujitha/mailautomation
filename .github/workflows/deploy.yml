name: TrainerSync CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/trainersync

jobs:
  source-code:
    name: Stage 1 - Checkout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Repository checked out"
          pwd
          ls -la
  build-test:
    name: Stage 2 - Backend Build & Test
    needs: source-code
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - core-api
          - email-service
          - notification-service
          - trainer-service
          - intelligence-service
          - document-service
          - scheduler-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: microservices/services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Validate Python
        working-directory: microservices/services/${{ matrix.service }}
        run: python -m compileall .

      - name: Run Tests
        working-directory: microservices/services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -v
          else
            echo "No tests found"
          fi
 
       
  frontend-build:

    name: "Stage 2 - Frontend Build"

    needs: source-code

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Files
        run: |
          echo "Repository Root"
          pwd
          ls -la
          echo "Frontend"
          ls -la frontend
          echo "Frontend Source"
          ls -la frontend/src
          echo "Pages"
          ls -la frontend/src/pages
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

# =========================================================
          
# STAGE 3 : DOCKER BUILD + GHCR PUSH

# =========================================================

  docker-build-push:
    name: Stage 3 - Docker Build & Push
    needs:
      - build-test
      - frontend-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            dockerfile: microservices/services/auth-service/Dockerfile

          - image: core-api
            dockerfile: microservices/services/core-api/Dockerfile

          - image: email-service
            dockerfile: microservices/services/email-service/Dockerfile

          - image: notification-service
            dockerfile: microservices/services/notification-service/Dockerfile

          - image: trainer-service
            dockerfile: microservices/services/trainer-service/Dockerfile

          - image: intelligence-service
            dockerfile: microservices/services/intelligence-service/Dockerfile

          - image: document-service
            dockerfile: microservices/services/document-service/Dockerfile

          - image: scheduler-service
            dockerfile: microservices/services/scheduler-service/Dockerfile

          - image: gateway-service
            dockerfile: microservices/gateway/Dockerfile

         
          - image: celery-service
            dockerfile: microservices/services/scheduler-service/Dockerfile

     
          - image: celery-beat-service
            dockerfile: microservices/services/scheduler-service/Dockerfile

          - image: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

# =========================================================
          
# STAGE 4 : DEPLOY TO EC2

# =========================================================

  deploy-ec2:
    name: Stage 4 - Deploy to EC2
    if: github.ref == 'refs/heads/main'
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create Deployment Directory
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p /home/ubuntu/trainersync"

      - name: Copy Backend Compose
        run: |
          scp microservices/docker-compose.yml \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/trainersync/backend-compose.yml

      - name: Copy Frontend Compose
        run: |
          scp docker-compose.yml \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/trainersync/frontend-compose.yml
      
      - name: Copy Backend Environment File
        run: |
          scp microservices/.env.example \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/trainersync/.env

      - name: Deploy
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GH_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << EOF
          set -e
          echo "===== Debug Info ====="
          whoami
          pwd
          echo "PATH=$PATH"

          which docker || true
          sudo apt update

          sudo apt install -y docker.io

          sudo systemctl enable docker

          sudo systemctl start docker
          sudo docker --version || true
          sudo apt install -y docker-compose-v2
          sudo docker compose version || true
          cd /home/ubuntu/trainersync

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GH_USER" \
            --password-stdin

          echo "Deploying Backend..."

          sudo docker compose -f backend-compose.yml pull
          sudo docker compose -f backend-compose.yml down --remove-orphans
          sudo docker compose -f backend-compose.yml up -d

          echo "Deploying Frontend..."

          sudo docker compose -f frontend-compose.yml pull
          sudo docker compose -f frontend-compose.yml down --remove-orphans
          sudo docker compose -f frontend-compose.yml up -d

          echo "Cleaning old images..."
          sudo docker image prune -af

          echo "Backend Containers"
          sudo docker compose -f backend-compose.yml ps

          echo "Frontend Containers"
          sudo docker compose -f frontend-compose.yml ps

          EOF
      - name: Verify
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo docker ps"